# Daily Issue Triage
# Reviews open CI/CD issues and produces priority report
# Schedule: 1:15 AM America/Los_Angeles (9:15 AM UTC)

name: Daily Issue Triage

on:
  schedule:
    - cron: '15 9 * * *'  # 1:15 AM PST (9:15 AM UTC)
  workflow_dispatch:       # Manual testing

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: List open CI issues
        id: list
        run: |
          echo "Querying open CI/automated issues..."
          gh issue list \
            --repo ${{ github.repository }} \
            --label "ci,automated" \
            --state open \
            --json number,title,labels,createdAt,updatedAt \
            --jq '.[] | "\(.number)|\(.title)|\(.labels | map(.name) | join(","))|\(.createdAt)|\(.updatedAt)"' \
            > issues.txt || touch issues.txt

          TOTAL=$(wc -l < issues.txt)
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          if [ "$TOTAL" -eq 0 ]; then
            echo "✅ No open CI issues found"
            exit 0
          fi

          # Categorize by failure type
          LINT=$(grep -c "lint-failure" issues.txt || echo 0)
          TYPECHECK=$(grep -c "typecheck-failure" issues.txt || echo 0)
          TEST=$(grep -c "test-failure" issues.txt || echo 0)
          BUILD=$(grep -c "build-failure" issues.txt || echo 0)
          DEPLOY=$(grep -c "deploy-failure" issues.txt || echo 0)

          echo "lint=$LINT" >> $GITHUB_OUTPUT
          echo "typecheck=$TYPECHECK" >> $GITHUB_OUTPUT
          echo "test=$TEST" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "deploy=$DEPLOY" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create triage report
        if: steps.list.outputs.total > 0
        run: |
          REPORT_FILE="triage-report.md"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          REPO="${{ github.repository }}"
          TOTAL="${{ steps.list.outputs.total }}"
          LINT="${{ steps.list.outputs.lint }}"
          TYPECHECK="${{ steps.list.outputs.typecheck }}"
          TEST="${{ steps.list.outputs.test }}"
          BUILD="${{ steps.list.outputs.build }}"
          DEPLOY="${{ steps.list.outputs.deploy }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Build report header
          {
            echo "## 📊 Daily CI Issue Triage Report"
            echo ""
            echo "**Generated:** ${TIMESTAMP}"
            echo "**Repository:** ${REPO}"
            echo ""
            echo "### Summary"
            echo ""
            echo "- **Total Open Issues:** ${TOTAL}"
            echo "- Lint Failures: ${LINT}"
            echo "- Typecheck Failures: ${TYPECHECK}"
            echo "- Test Failures: ${TEST}"
            echo "- Build Failures: ${BUILD}"
            echo "- Deploy Failures: ${DEPLOY}"
            echo ""
            echo "### Priority Ranking"
            echo ""
            echo "**🔴 Critical (Build/Deploy failures blocking releases):**"
          } > "$REPORT_FILE"

          # Add critical issues
          grep -E "build-failure|deploy-failure" issues.txt | while IFS='|' read -r num title labels created updated; do
            echo "- #$num: $title" >> "$REPORT_FILE"
          done || echo "None" >> "$REPORT_FILE"

          {
            echo ""
            echo "**🟠 High (Test failures affecting quality):**"
          } >> "$REPORT_FILE"

          grep "test-failure" issues.txt | while IFS='|' read -r num title labels created updated; do
            echo "- #$num: $title" >> "$REPORT_FILE"
          done || echo "None" >> "$REPORT_FILE"

          {
            echo ""
            echo "**🟡 Medium (Lint/typecheck issues):**"
          } >> "$REPORT_FILE"

          grep -E "lint-failure|typecheck-failure" issues.txt | while IFS='|' read -r num title labels created updated; do
            echo "- #$num: $title" >> "$REPORT_FILE"
          done || echo "None" >> "$REPORT_FILE"

          {
            echo ""
            echo "### Recommended Actions"
            echo ""
            echo "1. Address **Critical** issues first (blocking releases)"
            echo "2. Fix **High** priority items (quality impact)"
            echo "3. Clean up **Medium** issues in batches"
            echo ""
            echo "### Automation Notes"
            echo ""
            echo "- Issues are created after **2+ consecutive failures**"
            echo "- Fix locally, run full CI, then request push confirmation"
            echo "- Close issues manually after fixes are verified in CI"
            echo ""
            echo "---"
            echo ""
            echo "*This report is generated automatically. [View workflow run](${RUN_URL})*"
          } >> "$REPORT_FILE"

          echo "Report generated:"
          cat "$REPORT_FILE"

          # Create or update triage issue
          EXISTING=$(gh issue list \
            --repo ${{ github.repository }} \
            --label "triage-report" \
            --state open \
            --json number \
            --jq '.[0].number' || echo "")

          if [ -z "$EXISTING" ]; then
            gh issue create \
              --repo ${{ github.repository }} \
              --title "📊 CI Issue Triage Report ($(date +%Y-%m-%d))" \
              --body "$(cat $REPORT_FILE)" \
              --label "triage-report,automated"
          else
            gh issue comment $EXISTING \
              --repo ${{ github.repository }} \
              --body "$(cat $REPORT_FILE)"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          if [ "${{ steps.list.outputs.total }}" -eq 0 ]; then
            echo "✅ No open CI issues - system healthy"
          else
            echo "📊 Triage report created for ${{ steps.list.outputs.total }} open issues"
          fi
