# Secret Scan (gitleaks) — org-wide template
#
# Copy into a repo:
#   cp workflow-templates/gitleaks.yml <repo>/.github/workflows/gitleaks.yml
#
# Scans the full git history for committed secrets on every PR/push, weekly, and
# on demand, and fails the run on a real finding. Drop a .gitleaks.toml in the
# repo root to allowlist confirmed false positives — it is picked up automatically.
#
# The gitleaks binary is installed directly (not gitleaks-action), because
# gitleaks-action requires a paid GITLEAKS_LICENSE for organization-owned repos.
name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 9 * * 1' # weekly full-history scan, Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history
        run: gitleaks git . --redact --verbose --exit-code 1
